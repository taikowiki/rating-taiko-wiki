<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taiko Wiki Uploader</title>
    <style>
        :root {
            --primary-color: #ff4757;
            --bg-color: #f1f2f6;
            --card-bg: #ffffff;
            --text-color: #2f3542;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
        }

        .status-box {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
        }

        .label {
            font-size: 0.9rem;
            color: #747d8c;
            display: block;
        }

        .position-value {
            font-size: 3rem;
            font-weight: bold;
            margin: 0.5rem 0;
            display: block;
        }

        .total-value, .last-success-value {
            font-size: 0.9rem;
            font-weight: 500;
            margin-top: 0.3rem;
            display: block;
            color: #2f3542;
        }

        .divider {
            height: 1px;
            background: #dfe4ea;
            margin: 1rem 0;
        }

        .info-text {
            font-size: 0.9rem;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            width: 100%;
        }

        button:hover {
            background-color: #ff6b81;
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: #ced4da;
            cursor: not-allowed;
            transform: none;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #message {
            margin-top: 1rem;
            font-size: 0.85rem;
        }

        .error { color: #eb4d4b; }
        .success { color: #2ecc71; }
        
        .ws-status {
            font-size: 0.7rem;
            margin-top: 1rem;
            color: #bdc3c7;
        }

        .lang-switcher {
            margin-top: 1rem;
            font-size: 0.8rem;
            cursor: pointer;
            color: #747d8c;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 data-t="title">Taiko Uploader</h1>
        
        <div class="status-box">
            <span class="label" data-t="labelMyPosition">현재 내 대기 순번</span>
            <span id="position" class="position-value">-</span>
            <div id="status-text" class="info-text" data-t="statusConnecting">연결 중...</div>
            
            <div class="divider"></div>
            
            <span class="label" data-t="labelTotalQueue">현재 전체 대기자 수</span>
            <span id="total-count" class="total-value">0<span data-t="unitPerson">명</span></span>

            <div id="last-success-container" style="display: none;">
                <div class="divider"></div>
                <span class="label" data-t="labelLastSuccess">최근 성공 시간</span>
                <span id="last-success" class="last-success-value">-</span>
            </div>
        </div>

        <button id="requestBtn" disabled data-t="btnRequest">데이터 업데이트 요청</button>
        <div id="message"></div>
        <div id="ws-status" class="ws-status" data-t="wsConnecting">상태: 연결 중...</div>
        <div class="lang-switcher" onclick="toggleLang()">Switch Language (KO/EN/JP)</div>
    </div>

    <script>
        const i18n = {
            ko: {
                title: "Taiko Uploader",
                labelMyPosition: "현재 내 대기 순번",
                labelTotalQueue: "현재 전체 대기자 수",
                labelLastSuccess: "최근 성공 시간",
                unitPerson: "명",
                statusConnecting: "연결 중...",
                statusLoginRequired: "로그인이 필요합니다.",
                statusNotInQueue: "현재 큐에 대기 중이 아닙니다.",
                statusWorking: "내 데이터를 크롤링하고 있습니다...",
                statusWaiting: "데이터 처리 대기 중입니다...",
                workingLabel: "작업 중",
                btnRequest: "데이터 업데이트 요청",
                btnRequesting: "요청 중...",
                msgSuccess: "요청이 성공했습니다.",
                msgAlreadyInQueue: "이미 큐에 등록되어 있습니다.",
                msgError: "오류가 발생했습니다.",
                msgServerError: "서버 연결 오류",
                wsConnecting: "상태: 연결 중...",
                wsConnected: "상태: 실시간 연결됨",
                wsDisconnected: "상태: 연결 끊김 (재연결 시도 중...)"
            },
            en: {
                title: "Taiko Uploader",
                labelMyPosition: "My Queue Position",
                labelTotalQueue: "Total Queue Count",
                labelLastSuccess: "Last Successful Update",
                unitPerson: " users",
                statusConnecting: "Connecting...",
                statusLoginRequired: "Login required.",
                statusNotInQueue: "Not currently in queue.",
                statusWorking: "Crawling your data...",
                statusWaiting: "Waiting in queue...",
                workingLabel: "Working",
                btnRequest: "Request Data Update",
                btnRequesting: "Requesting...",
                msgSuccess: "Request successful.",
                msgAlreadyInQueue: "Already in queue.",
                msgError: "An error occurred.",
                msgServerError: "Server connection error",
                wsConnecting: "Status: Connecting...",
                wsConnected: "Status: Live Connected",
                wsDisconnected: "Status: Disconnected (Retrying...)"
            },
            jp: {
                title: "太鼓アップローダー",
                labelMyPosition: "現在の待ち順位",
                labelTotalQueue: "現在の全待機者数",
                labelLastSuccess: "最終成功時間",
                unitPerson: "人",
                statusConnecting: "接続中...",
                statusLoginRequired: "ログインが必要です。",
                statusNotInQueue: "現在キューに待機していません。",
                statusWorking: "データを取得しています...",
                statusWaiting: "データ処理待機中です...",
                workingLabel: "処理中",
                btnRequest: "データ更新リクエスト",
                btnRequesting: "リクエスト中...",
                msgSuccess: "リクエストに成功しました。",
                msgAlreadyInQueue: "すでにキューに登録されています。",
                msgError: "エラーが発生しました。",
                msgServerError: "サーバー接続エラー",
                wsConnecting: "状態: 接続中...",
                wsConnected: "状態: リアルタイム接続中",
                wsDisconnected: "状態: 接続が切れました (再接続試行中...)"
            }
        };

        const langOrder = ['ko', 'en', 'jp'];
        let currentLang = localStorage.getItem('lang') || 'ko';
        if (!i18n[currentLang]) currentLang = 'ko';

        function t(key) {
            return i18n[currentLang][key] || key;
        }

        function updateStaticTexts() {
            document.querySelectorAll('[data-t]').forEach(el => {
                const key = el.getAttribute('data-t');
                if (i18n[currentLang][key]) {
                    el.innerText = i18n[currentLang][key];
                }
            });
        }

        function toggleLang() {
            const nextIndex = (langOrder.indexOf(currentLang) + 1) % langOrder.length;
            currentLang = langOrder[nextIndex];
            localStorage.setItem('lang', currentLang);
            updateStaticTexts();
            checkPositionManual();
        }

        const positionEl = document.getElementById('position');
        const statusTextEl = document.getElementById('status-text');
        const totalCountEl = document.getElementById('total-count');
        const lastSuccessEl = document.getElementById('last-success');
        const lastSuccessContainer = document.getElementById('last-success-container');
        const requestBtn = document.getElementById('requestBtn');
        const messageEl = document.getElementById('message');
        const wsStatusEl = document.getElementById('ws-status');

        let socket = null;

        function formatDate(timestamp) {
            if (!timestamp) return "-";
            const date = new Date(timestamp);
            const locales = { ko: 'ko-KR', en: 'en-US', jp: 'ja-JP' };
            return date.toLocaleString(locales[currentLang] || 'ko-KR');
        }

        function updateUI(data) {
            if (data.totalQueueCount !== undefined) {
                totalCountEl.innerHTML = `${data.totalQueueCount}<span data-t="unitPerson">${t('unitPerson')}</span>`;
            }

            if (data.authenticated === false) {
                statusTextEl.innerText = t('statusLoginRequired');
                positionEl.innerText = "-";
                requestBtn.disabled = true;
                lastSuccessContainer.style.display = "none";
                return;
            }

            if (data.lastSuccessTime) {
                lastSuccessEl.innerText = formatDate(data.lastSuccessTime);
                lastSuccessContainer.style.display = "block";
            }

            if (data.position !== undefined) {
                const pos = data.position;
                if (pos === null) {
                    positionEl.innerText = "-";
                    statusTextEl.innerText = t('statusNotInQueue');
                    requestBtn.disabled = false;
                } else if (pos === 0) {
                    positionEl.innerText = t('workingLabel');
                    statusTextEl.innerText = t('statusWorking');
                    requestBtn.disabled = true;
                } else {
                    positionEl.innerText = pos;
                    statusTextEl.innerText = t('statusWaiting');
                    requestBtn.disabled = true;
                }
            }
        }

        function connectWS() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            socket = new WebSocket(`${protocol}//${window.location.host}/ws`);

            socket.onopen = () => {
                wsStatusEl.innerText = t('wsConnected');
                wsStatusEl.style.color = "#2ecc71";
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'update' || data.type === 'totalUpdate') {
                    updateUI(data);
                } else if (data.type === 'refreshRequest') {
                    checkPositionManual();
                }
            };

            socket.onclose = () => {
                wsStatusEl.innerText = t('wsDisconnected');
                wsStatusEl.style.color = "#e74c3c";
                setTimeout(connectWS, 3000);
            };
        }

        async function checkPositionManual() {
            try {
                const res = await fetch('/position', { method: 'POST' });
                const data = await res.json();
                updateUI(data);
            } catch (err) {
                console.error(err);
            }
        }

        async function requestCrawl() {
            requestBtn.disabled = true;
            requestBtn.innerHTML = `<span class="loading-spinner"></span>${t('btnRequesting')}`;
            messageEl.innerText = "";

            try {
                const res = await fetch('/request', { method: 'POST' });
                if (res.status === 409) {
                    messageEl.innerText = t('msgAlreadyInQueue');
                    messageEl.className = "error";
                } else if (res.status === 200) {
                    messageEl.innerText = t('msgSuccess');
                    messageEl.className = "success";
                    const data = await res.json();
                    updateUI(data);
                } else {
                    messageEl.innerText = t('msgError');
                    messageEl.className = "error";
                }
            } catch (err) {
                messageEl.innerText = t('msgServerError');
                messageEl.className = "error";
            } finally {
                requestBtn.innerHTML = t('btnRequest');
            }
        }

        requestBtn.addEventListener('click', requestCrawl);
        
        // 초기 실행
        updateStaticTexts();
        connectWS();
    </script>
</body>
</html>
