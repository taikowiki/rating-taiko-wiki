name: Build

on:
    push:
        tags:
            - "v*"

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
          contents: write

        defaults:
            run:
                working-directory: site

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install
            
            - name: Build
              run: bun run build

            - name: Zip builded application
              run: zip -r build.zip ./package.json ./build

            - name: Package version
              id: pkg
              run: echo "version=$(bun --eval 'console.log(require(`./package.json`).version)')" >> $GITHUB_OUTPUT

            - name: Create Release
              id: create_release
              uses: comnoco/create-release-action@v2
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                tag_name: ${{github.ref_name}}
                release_name: v${{steps.pkg.outputs.version}} - ${{github.run_id}}
                draft: false
                prerelease: false
            
            - name: Upload builded application
              id: upload_builded_app
              uses: actions/upload-release-asset@v1
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                upload_url: ${{ steps.create_release.outputs.upload_url }}
                asset_path: ./site/build.zip
                asset_name: build.zip
                asset_content_type: application/zip

            - name: Request deploy
              run: |
                curl -X POST "https://rating-deploy.taiko.wiki" \
                -H "Content-Type: application/json" \
                -H "X-Internal-Key: ${{ secrets.INTERNAL_API_KEY }}"
                -d "{\"tag\": \"${{ github.ref_name }}\"}"